<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stock alimentaire : scan de codes-barres et QR codes, dates de péremption, liste de courses.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Garde-manger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: native-app shell — scrolling shelf of products, floating glass tab bar with a raised scan button, bottom sheets that spring up.
   Identity: every storage place has its own colour, every product carries a "freshness ring", every scan prints a till receipt. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#0f1720; --muted:#5f6b78; --line:#dde3ea;
  --laser:#ff3d2e; --laser-glow:rgba(255,61,46,.45); --paper:#fbfaf6; --paper-ink:#24221d;
  --ok:#1f9d61; --warn:#e08a00; --bad:#e5383b;
  --frigo:#4aa8ff; --congel:#8b7dff; --placard:#f2a92c; --cave:#3fb37f;
  --glass:rgba(255,255,255,.72); --scrim:rgba(12,18,26,.42); --shadow:0 10px 30px -12px rgba(15,23,32,.25);
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.9,.25,1.15);
  --spring:cubic-bezier(.2,.9,.25,1.15);
}
@supports (transition-timing-function:linear(0,1)){:root{
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14; --surface:#141a22; --surface-2:#1a212b; --ink:#eef2f6; --muted:#8d99a7; --line:#232c37;
  --laser:#ff5a4b; --laser-glow:rgba(255,90,75,.5); --paper:#f4f1e8; --paper-ink:#24221d;
  --ok:#34c77f; --warn:#ffad2e; --bad:#ff5d5f;
  --frigo:#5cb4ff; --congel:#a197ff; --placard:#ffbe4d; --cave:#4fcf93;
  --glass:rgba(20,26,34,.72); --scrim:rgba(0,0,0,.6); --shadow:0 12px 34px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#141a22; --surface-2:#1a212b; --ink:#eef2f6; --muted:#8d99a7; --line:#232c37;
  --laser:#ff5a4b; --laser-glow:rgba(255,90,75,.5); --paper:#f4f1e8; --paper-ink:#24221d;
  --ok:#34c77f; --warn:#ffad2e; --bad:#ff5d5f;
  --frigo:#5cb4ff; --congel:#a197ff; --placard:#ffbe4d; --cave:#4fcf93;
  --glass:rgba(20,26,34,.72); --scrim:rgba(0,0,0,.6); --shadow:0 12px 34px -12px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--laser);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.press{transition:transform .35s var(--spring)}
.press:active{transform:scale(.94);transition-duration:.08s}

.app{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 150px}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.date{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.75rem,8vw,2.3rem);letter-spacing:-.035em;line-height:1;margin:6px 0 0;text-wrap:balance}
.round{width:46px;height:46px;flex:none;border-radius:16px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow)}
.round svg{width:22px;height:22px}
.round.ghost{background:var(--surface);color:var(--ink);position:relative}
.top-act{display:flex;gap:8px}
.sdot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
.sync-state{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:14px;margin-bottom:16px}
.sync-state>i{flex:none;width:12px;height:12px;margin-top:4px;border-radius:50%;background:var(--rc);box-shadow:0 0 0 5px color-mix(in srgb,var(--rc) 20%,transparent)}
.sync-state div{display:grid;gap:3px;min-width:0}
.sync-state span{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.form-err{margin:0;color:var(--bad);font-size:.88rem}
.hint{margin:0;font-size:.8rem;color:var(--muted)}
.btn:disabled{opacity:.6}

/* Freshness card */
.fresh{margin-top:20px;background:var(--surface);border-radius:26px;padding:18px;box-shadow:var(--shadow);display:grid;gap:14px}
.fresh-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:700;font-size:2.6rem;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
.big-l{display:block;font-size:.82rem;color:var(--muted);margin-top:6px}
.watch{border:0;border-radius:999px;padding:8px 12px 8px 10px;background:var(--surface-2);font-weight:600;font-size:.82rem;display:flex;align-items:center;gap:6px}
.watch .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent)}
.seg{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:3px}
.seg i{display:block;height:100%;border-radius:999px;transition:flex-grow .8s var(--spring)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-weight:600}
.legend i{width:8px;height:8px;border-radius:3px}

/* Search + chips */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);margin-inline:-4px;padding:14px 4px 6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;padding:13px 0;width:100%;min-width:0;font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}


/* Shelves */
.shelf{margin-top:24px}
.shelf-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--f-display);font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.shelf-h i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.shelf-h span{margin-left:auto;font-family:var(--f-mono);font-weight:400;font-size:.7rem;color:var(--muted)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:10px 10px 10px 10px;animation:rise .55s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.ring{--p:100;--rc:var(--muted);width:50px;height:50px;border-radius:50%;padding:3px;background:conic-gradient(var(--rc) calc(var(--p)*1%),color-mix(in srgb,var(--rc) 14%,transparent) 0);display:grid}
.ring b{border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--ink));display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.82rem;letter-spacing:-.02em;border:2px solid var(--surface)}
.info{min-width:0;border:0;background:none;text-align:left;padding:2px 0}
.name{font-weight:600;font-size:.98rem;line-height:1.25;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:.78rem;color:var(--muted)}
.exp{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.02em;padding:3px 7px;border-radius:7px;color:var(--rc);background:color-mix(in srgb,var(--rc) 13%,transparent)}
.step{display:flex;align-items:center;background:var(--surface-2);border-radius:14px;padding:3px}
.step button{width:34px;height:34px;border:0;background:none;border-radius:11px;display:grid;place-items:center}
.step button:active{background:var(--surface)}
.step svg{width:16px;height:16px}
.num{min-width:2.6em;height:34px;overflow:hidden;display:grid;place-items:center;text-align:center;line-height:1}
.num output{display:block;font-family:var(--f-display);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums;animation:roll .45s var(--spring)}
.num small{display:block;font-family:var(--f-body);font-weight:500;font-size:.6rem;color:var(--muted);margin-top:1px}
@keyframes roll{from{transform:translateY(80%);opacity:0}}
.buy{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.82rem;padding:9px 12px}
.x-sm{border:0;background:none;width:34px;height:34px;color:var(--muted);border-radius:10px}

.empty{display:grid;justify-items:center;text-align:center;padding:56px 12px 20px;color:var(--muted);gap:6px}
.empty .art{width:84px;height:84px;border-radius:28px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:10px}
.empty .art svg{width:40px;height:40px;color:var(--laser)}
.empty h3{font-family:var(--f-display);font-size:1.15rem;color:var(--ink);margin:0}
.empty p{margin:0;max-width:30ch}

/* Tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;pointer-events:none;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.tabbar{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:68px;border-radius:26px;background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.tab{border:0;background:none;height:100%;display:grid;place-content:center;justify-items:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;bottom:8px;width:4px;height:4px;border-radius:50%;background:var(--laser)}
.badge{position:absolute;top:10px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--laser);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(0)}}
.fab{justify-self:center;width:72px;height:72px;margin-top:-34px;border-radius:24px;border:0;background:var(--laser);color:#fff;display:grid;place-items:center;
  box-shadow:0 14px 30px -8px var(--laser-glow),inset 0 -3px 0 rgba(0,0,0,.15);position:relative;overflow:hidden}
.fab svg{width:32px;height:32px;position:relative}
.fab::before{content:"";position:absolute;left:10px;right:10px;height:2px;top:50%;background:rgba(255,255,255,.9);box-shadow:0 0 8px #fff;animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-16px)}50%{transform:translateY(16px)}}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease both}
.scrim.out{animation:fadeout .24s ease both}
@keyframes fade{from{opacity:0}} @keyframes fadeout{to{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:30px 30px 0 0;animation:sheetin .55s var(--spring) both;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));touch-action:pan-y}
.sheet.out{animation:sheetout .24s cubic-bezier(.4,0,1,1) both}
@keyframes sheetin{from{transform:translateY(100%)}} @keyframes sheetout{to{transform:translateY(105%)}}
.grab{display:grid;place-items:center;height:28px;cursor:grab;touch-action:none;position:sticky;top:0;background:var(--bg);z-index:1}
.grab span{width:42px;height:5px;border-radius:9px;background:var(--line)}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:-.025em;margin:4px 0 16px}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px;font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem;width:100%;min-width:0;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.places{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.place{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
.place i{width:14px;height:14px;border-radius:5px;background:var(--c)}
.place[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.76rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:16px;padding:15px;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--ink);color:var(--bg)}
.btn.del{flex:0 0 auto;background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);padding-inline:18px}

/* Receipt printed by a scan */
.ticket{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:.68rem;line-height:1.7;padding:16px 16px 22px;margin:0 6px 18px;border-radius:4px 4px 0 0;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;
  animation:print 1s steps(16,end) .15s both;box-shadow:0 1px 0 rgba(0,0,0,.04)}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.ticket .r{display:flex;justify-content:space-between;gap:10px}
.ticket .r span:last-child{text-align:right;overflow-wrap:anywhere}
.ticket hr{border:0;border-top:1px dashed currentColor;opacity:.45;margin:8px 0}
.ticket .t-big{font-weight:600;font-size:.86rem;text-transform:uppercase;line-height:1.35;margin:4px 0;overflow-wrap:anywhere}
.ticket .t-head{text-align:center;font-weight:600;letter-spacing:.2em}
.ticket svg{display:block;width:100%;height:38px;margin-top:10px;color:var(--paper-ink)}

/* Scanner */
.scan{position:fixed;inset:0;z-index:30;background:#05070a;color:#fff;display:flex;flex-direction:column;animation:fade .25s ease both;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.scan.out{animation:fadeout .22s ease both}
.scan-top{display:flex;justify-content:space-between;align-items:center}
.scan-top b{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.scan-x{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.scan-x svg{width:20px;height:20px}
.stage{flex:1;display:grid;place-items:center;position:relative;min-height:0}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px}
.frame{position:relative;width:min(78vw,340px);aspect-ratio:1.45;max-width:100%}
.frame::before{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:0 0 0 100vmax rgba(5,7,10,.55)}
.corner{position:absolute;width:34px;height:34px;border:4px solid #fff;transition:border-color .2s,transform .5s var(--spring)}
.c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:20px 0 0 0}.c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 20px 0 0}
.c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 20px}.c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 20px 0}
.laser{position:absolute;left:6%;right:6%;top:50%;height:3px;border-radius:3px;background:var(--laser);box-shadow:0 0 12px 2px var(--laser),0 0 34px 8px var(--laser-glow);animation:laser 1.6s ease-in-out infinite}
@keyframes laser{0%,100%{transform:translateY(-38px);opacity:.75}50%{transform:translateY(38px);opacity:1}}
.reading .laser{animation-duration:.5s}
.found .corner{border-color:#3ee08a;transform:scale(.92)}
.found .laser{background:#3ee08a;box-shadow:0 0 14px 3px #3ee08a,0 0 40px 10px rgba(62,224,138,.45);animation:none;transform:none}
.flash{position:absolute;inset:0;border-radius:22px;background:#3ee08a;opacity:0;animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.ghost-code{position:absolute;inset:26% 16%;display:flex;gap:3px;align-items:stretch;opacity:.16}
.ghost-code i{flex:var(--w);background:#fff;border-radius:1px}
.scan-msg{text-align:center;font-size:.92rem;color:rgba(255,255,255,.78);margin:16px auto 14px;max-width:34ch;min-height:2.8em}
.scan-msg.err{color:#ffb4ab}
.scan-cta{display:grid;gap:10px}
.cam{position:relative;overflow:hidden;border-radius:18px;background:#fff;color:#05070a;font-weight:700;font-size:1.02rem;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.cam svg{width:22px;height:22px}
.cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:16px;padding:14px;font-family:var(--f-mono);font-size:.9rem;outline:none}
.typed input::placeholder{color:rgba(255,255,255,.4)}
.typed button{border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:0 16px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:14px;

/* Install gate: on a phone, Garde-manger is meant to run as an installed web app.
   When it is opened in a browser tab, show how to install it for this exact OS + browser.
   Plain DOM on purpose, so it works even before the app's libraries have loaded. */
(function(){
  var gate=document.getElementById("gate");
  var bip=null, installed=false;
  addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); bip=e; render(); });

  var standalone = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone===true;

  var inApp=/FBAN|FBAV|FB_IAB|Instagram|LinkedInApp|Snapchat|Line\/|Twitter|TikTok|musical_ly|GSA\//i.test(ua) || (android && /; wv\)/.test(ua));
  var browser = ios ? (/CriOS/.test(ua)?"chrome":/FxiOS/.test(ua)?"firefox":/EdgiOS/.test(ua)?"edge":/OPiOS|OPT\//.test(ua)?"opera":"safari")
                    : (/SamsungBrowser/.test(ua)?"samsung":/Firefox/.test(ua)?"firefox":/EdgA/.test(ua)?"edge":/OPR|Opera/.test(ua)?"opera":"chrome");
  if(inApp) browser="inapp";

  var G={
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 10H5v11h14V10h-2"/></svg>',
    addHome:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
    dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
    hdots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',

    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18.5h2"/></svg>',
    compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>'
  };
  var k=function(icon,label){ return '<span class="k">'+(icon?G[icon]:"")+(label?'<b>'+label+'</b>':"")+'</span>'; };

  // steps + where the browser's button sits on screen (for the pointing arrow)
  var guides={
    ios:{
      safari:{name:"Safari · iPhone", arrow:"bottom", steps:[
        "Touchez "+k("share")+" <b>Partager</b> dans la barre du bas. Sur iOS 26, il est dans le menu "+k("hdots")+".",
        "Faites défiler et touchez "+k("addHome","Sur l'écran d'accueil")+".",

      chrome:{name:"Chrome · iPhone", arrow:"top-right", steps:[
        "Touchez "+k("share")+" <b>Partager</b>, à droite de la barre d'adresse.",
        "Touchez "+k("addHome","Ajouter à l'écran d'accueil")+" (sous <b>Plus</b> s'il n'apparaît pas).",
        "Touchez <b>Ajouter</b>.",
        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      firefox:{name:"Firefox · iPhone", arrow:"bottom-right", steps:[
        "Touchez le menu "+k("burger")+" en bas à droite, puis "+k("share","Partager")+".",
        "Touchez "+k("addHome","Sur l'écran d'accueil")+", puis <b>Ajouter</b>.",
        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      edge:{name:"Edge · iPhone", arrow:"bottom", steps:[
        "Touchez "+k("hdots")+" en bas de l'écran, puis "+k("share","Partager")+".",
        "Touchez "+k("addHome","Sur l'écran d'accueil")+", puis <b>Ajouter</b>.",
        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      opera:{name:"Opera · iPhone", arrow:"bottom", steps:[
        "Touchez "+k("share","Partager")+" depuis le menu du navigateur.",

        "Touchez "+k("hdots")+" ou "+k("compass")+" en haut ou en bas de l'écran.",

    },
    android:{
      chrome:{name:"Chrome · Android", arrow:"top-right", steps:[
        "Touchez "+k("dots")+" en haut à droite.",
        "Touchez "+k("phone","Ajouter à l'écran d'accueil")+" puis <b>Installer</b>.",

        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      firefox:{name:"Firefox · Android", arrow:"top-right", steps:[
        "Touchez "+k("dots")+" (en haut ou en bas à droite selon votre réglage).",
        "Touchez "+k("phone","Ajouter à l'écran d'accueil")+" puis <b>Ajouter</b>.",
        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      edge:{name:"Edge · Android", arrow:"bottom", steps:[
        "Touchez "+k("burger")+" en bas de l'écran.",
        "Touchez "+k("phone","Ajouter au téléphone")+" puis <b>Installer</b>.",
        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      opera:{name:"Opera · Android", arrow:"top-right", steps:[
        "Touchez "+k("dots")+" en haut à droite.",
        "Touchez "+k("phone","Écran d'accueil")+" puis <b>Ajouter</b>.",
        "Ouvrez <b>Garde-manger</b> depuis votre écran d'accueil."]},
      inapp:{name:"Navigateur intégré", arrow:"top-right", inapp:true, steps:[
        "Touchez "+k("dots")+" en haut à droite.",
        "Choisissez <b>Ouvrir dans Chrome</b> (ou « Ouvrir dans le navigateur »).",
        "Dans Chrome, touchez <b>Installer</b> sur l'écran qui s'affichera."]}
    }
  };
  var g=guides[ios?"ios":"android"][browser];

  function render(){
    var html='';
    if(installed){
      html='<div class="g-in"><img class="g-icon" src="icons/icon-192.png" alt="" width="84" height="84">'+
        '<h1>C\'est installé&nbsp;!</h1><p class="g-lead">Fermez cet onglet et ouvrez <b>Garde-manger</b> depuis votre écran d\'accueil.</p></div>';
    } else {
      html='<div class="g-in">'+
        '<img class="g-icon" src="icons/icon-192.png" alt="" width="84" height="84">'+
        '<span class="g-chip">'+g.name+'</span>'+
        '<h1>Installez Garde-manger</h1>'+
        '<p class="g-lead">'+(g.inapp?"Vous êtes dans le navigateur d'une autre app : il ne permet pas d'installer Garde-manger.":"L'app s'ouvrira en plein écran depuis votre écran d'accueil, avec la caméra et la synchronisation.")+'</p>'+
        (bip?'<button class="g-cta" id="g-install">Installer l\'app</button><p class="g-or">ou à la main :</p>':'')+
        '<ol class="g-steps">'+g.steps.map(function(s){ return '<li><span>'+s+'</span></li>'; }).join("")+'</ol>'+
        (g.inapp?'<button class="g-copy" id="g-copy">Copier le lien</button>':'')+
        '<button class="g-skip" id="g-skip">Continuer dans le navigateur</button>'+
      '</div>'+(bip?'':'<div class="g-arrow g-'+g.arrow+'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>');
    }
    gate.innerHTML=html; gate.hidden=false;
    document.documentElement.classList.add("gated");
    var b=document.getElementById("g-install");
    if(b) b.onclick=function(){ bip.prompt(); bip.userChoice.then(function(c){ if(c.outcome==="accepted"){ installed=true; } bip=null; render(); }); };
    var s=document.getElementById("g-skip");
    if(s) s.onclick=function(){ try{ sessionStorage.setItem("gm-skip-install","1"); }catch(e){} gate.hidden=true; document.documentElement.classList.remove("gated"); };
    var c=document.getElementById("g-copy");
    if(c) c.onclick=function(){
      var done=function(){ c.textContent="Lien copié"; };
      if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(done,function(){ prompt("Copiez ce lien :",location.href); });
      else prompt("Copiez ce lien :",location.href);
    };
  }
  render();
})();
</script>

<script>
const {useState,useEffect,useMemo,useRef} = React;

/* ---------- Domain ---------- */
const PLACES = [
  {id:"Frigo",c:"var(--frigo)"},{id:"Congélateur",c:"var(--congel)"},

const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const daysLeft = (s) => s ? Math.round((new Date(s+"T00:00:00") - today())/864e5) : null;
const status = (it) => { const d=daysLeft(it.expiry); if(d===null) return "none"; if(d<0) return "bad"; if(d<=3) return "warn"; return "ok"; };

function pbReq(cfg,path,opt={}){
  const headers={"Content-Type":"application/json"}; if(cfg.token) headers.Authorization=cfg.token;
  return fetch(cfg.url+path,{...opt,headers}).then(async r=>{
    if(r.status===204) return null;
    const j=await r.json().catch(()=>null);
    if(!r.ok){ const e=new Error((j&&j.message)||("Erreur "+r.status)); e.status=r.status; throw e; }
    return j;
  });
}

function useStock(){
  const [items,setItems] = useState(()=> (loadLocal() || []).filter(i=>!i.demo));
  const [pb,setPb] = useState(()=> lsGet(PB_KEY,null));            // {url, token, email}
  const [sync,setSync] = useState(()=> lsGet(PB_KEY,null) ? "connecting" : "local"); // local | connecting | live | offline | error
  const [pending,setPending] = useState(()=> lsGet(Q_KEY,[]).length);
  const itemsRef = useRef(items), cfg = useRef(pb), queue = useRef(lsGet(Q_KEY,[])), flushing = useRef(false);
  itemsRef.current = items; cfg.current = pb;

  const saveQ = ()=>{ lsSet(Q_KEY,queue.current); setPending(queue.current.length); };
  const opId = (o)=> o.op==="put" ? o.it.id : o.id;
  // put/del replace whatever was pending for that item; +/- steps add up so no tap is lost
  const enqueue = (op)=>{ const id=opId(op);
    if(op.op==="inc"){
      let last=-1; queue.current.forEach((o,i)=>{ if(opId(o)===id) last=i; });
      const prev=queue.current[last];
      if(prev && prev.op==="inc" && !(last===0 && flushing.current)) prev.d+=op.d; else queue.current.push(op);
    } else { queue.current = queue.current.filter(o=>opId(o)!==id); queue.current.push(op); }
    saveQ(); };
  const pendingIds = ()=> new Set(queue.current.map(opId));

  const flush = async()=>{
    const c=cfg.current; if(!c||!c.token||flushing.current) return true; flushing.current=true;
    try{
      while(queue.current.length){
        const op=queue.current[0];
        if(op.op==="put"){
          try{ await pbReq(c,`/api/collections/stock/records/${op.it.id}`,{method:"PATCH",body:JSON.stringify(toRec(op.it))}); }
          catch(e){ if(e.status!==404) throw e;
            await pbReq(c,`/api/collections/stock/records`,{method:"POST",body:JSON.stringify({id:op.it.id,...toRec(op.it)})}); }
        } else if(op.op==="inc"){
          // server-side increment: two phones tapping +1 at the same time both count
          if(op.d!==0){
            try{
              const r=await pbReq(c,`/api/collections/stock/records/${op.id}`,{method:"PATCH",body:JSON.stringify(op.d>0?{"qty+":op.d}:{"qty-":-op.d})});
              if(r && Number(r.qty)<0) await pbReq(c,`/api/collections/stock/records/${op.id}`,{method:"PATCH",body:JSON.stringify({qty:0})});
            }catch(e){ if(e.status!==404) throw e;
              const it=itemsRef.current.find(x=>x.id===op.id);
              if(it) await pbReq(c,`/api/collections/stock/records`,{method:"POST",body:JSON.stringify({id:it.id,...toRec(it)})}); }
          }
        } else {
          try{ await pbReq(c,`/api/collections/stock/records/${op.id}`,{method:"DELETE"}); }catch(e){ if(e.status!==404) throw e; }
        }
        queue.current = queue.current.filter(o=>o!==op); saveQ();
      }
      return true;
    }catch(e){ setSync(e.status===401||e.status===403?"error":"offline"); return false; }
    finally{ flushing.current=false; }
  };

  const pull = async()=>{
    const c=cfg.current; let all=[];
    for(let p=1;;p++){ const j=await pbReq(c,`/api/collections/stock/records?page=${p}&perPage=500&skipTotal=1`); all=all.concat(j.items); if(j.items.length<500) break; }
    const pend=pendingIds(); const deleted=new Set(queue.current.filter(o=>o.op==="del").map(o=>o.id));
    const keep=itemsRef.current.filter(i=>pend.has(i.id)&&!deleted.has(i.id));
    vt(()=>setItems([...all.map(fromRec).filter(i=>!pend.has(i.id)),...keep]));
  };
  const resync = async()=>{ if(!cfg.current) return; setSync("connecting");
    try{ if(await flush()){ await pull(); setSync("live"); } }catch(e){ setSync(e.status===401||e.status===403?"error":"offline"); } };


  // PocketBase: refresh the session, then live updates over server-sent events
  useEffect(()=>{
    if(!pb||!pb.token){ setSync("local"); return; }
    let es=null, alive=true; setSync("connecting");
    (async()=>{
      try{
        const r=await pbReq(cfg.current,"/api/collections/users/auth-refresh",{method:"POST"});
        if(r&&r.token){ const n={...cfg.current,token:r.token}; cfg.current=n; lsSet(PB_KEY,n); }
      }catch(e){ if(e.status===401||e.status===403){ if(alive) setSync("error"); return; } }
      if(!alive) return;
      es=new EventSource(cfg.current.url+"/api/realtime");
      es.addEventListener("PB_CONNECT",async e=>{
        try{
          const {clientId}=JSON.parse(e.data);
          await pbReq(cfg.current,"/api/realtime",{method:"POST",body:JSON.stringify({clientId,subscriptions:["stock/*"]})});
          await resync();
        }catch(x){ setSync("offline"); }
      });
      es.addEventListener("stock/*",e=>{
        let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
        if(!m||!m.record||pendingIds().has(m.record.id)) return;
        const it=fromRec(m.record);
        vt(()=>setItems(p=>{ if(m.action==="delete") return p.filter(i=>i.id!==it.id);
          const i=p.findIndex(x=>x.id===it.id); const n=[...p]; i<0?n.push(it):n[i]=it; return n; }));
      });
      es.onerror=()=>setSync(s=>s==="error"?s:"offline");
    })();
    const online=()=>resync(); addEventListener("online",online);
    return ()=>{ alive=false; es&&es.close(); removeEventListener("online",online); };
  },[pb&&pb.url,pb&&pb.token]);

  useEffect(()=>{ saveLocal(items); },[items]);

  const put = (it)=>{ setItems(p=>{const i=p.findIndex(x=>x.id===it.id); const n=[...p]; i<0?n.push(it):n[i]=it; return n;});
    if(cfg.current&&cfg.current.token){ enqueue({op:"put",it}); flush(); } };
  const bump = (it,d)=>{ const n=Math.max(0,(Number(it.qty)||0)+d);
    setItems(p=>p.map(x=>x.id===it.id?{...x,qty:n}:x));
    if(cfg.current&&cfg.current.token){ enqueue({op:"inc",id:it.id,d}); flush(); }
    return n; };
  const del = (id)=>{ setItems(p=>p.filter(x=>x.id!==id));
    if(cfg.current&&cfg.current.token){ enqueue({op:"del",id}); flush(); } };

  const login = async(url,email,password)=>{
    url=url.trim().replace(/\/+$/,""); if(!/^https?:\/\//.test(url)) url="https://"+url;
    if(location.protocol==="https:"&&url.startsWith("http:")){ const e=new Error("Le serveur doit être en HTTPS : un site HTTPS ne peut pas parler à un serveur HTTP."); throw e; }
    let r;
    try{ r=await pbReq({url},"/api/collections/users/auth-with-password",{method:"POST",body:JSON.stringify({identity:email.trim(),password})}); }
    catch(e){ if(!e.status) throw new Error("Serveur injoignable. Vérifiez l'adresse et que PocketBase tourne.");
      if(e.status===400) throw new Error("E-mail ou mot de passe incorrect."); throw e; }
    // send what is already on this phone, with ids PocketBase accepts
    const mine=itemsRef.current.map(i=>isPbId(i.id)?i:{...i,id:uid()});
    setItems(mine);
    mine.forEach(it=>enqueue({op:"put",it}));
    const n={url,token:r.token,email:(r.record&&r.record.email)||email.trim()};
    lsSet(PB_KEY,n); cfg.current=n; setPb(n);
  };
  const logout = ()=>{ lsSet(PB_KEY,null); queue.current=[]; saveQ(); cfg.current=null; setPb(null); };

  return {items,put,del,bump,sync,pb,pending,login,logout,resync};
}

/* ---------- Sync settings ---------- */
const SYNC_LABEL={local:"Sur ce téléphone uniquement",connecting:"Connexion…",live:"Synchronisé",offline:"Hors ligne · en attente",error:"Session expirée"};
const SYNC_COLOR={local:"var(--muted)",connecting:"var(--warn)",live:"var(--ok)",offline:"var(--warn)",error:"var(--bad)"};
function SyncSheet({store,onClose}){
  const {pb,sync,pending,login,logout,resync}=store;
  const [url,setUrl]=useState(pb?pb.url:DEFAULT_SERVER); const [email,setEmail]=useState(pb?pb.email:""); const [pw,setPw]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ e.preventDefault(); setErr(""); setBusy(true);
    try{ await login(url,email,pw); setPw(""); buzz(15); }catch(x){ setErr(x.message); buzz([30,60,30]); } finally{ setBusy(false); } };
  const connected = pb && sync!=="error";
  return html`<${Sheet} label="Synchronisation" onClose=${onClose}>${(close)=>html`
    <h2>Synchronisation</h2>
    <div class="sync-state" style=${{"--rc":SYNC_COLOR[sync]}}><i></i><div><b>${SYNC_LABEL[sync]}</b>
      <span>${pb?`${pb.email} · ${pb.url.replace(/^https?:\/\//,"")}`:"Connectez votre serveur PocketBase pour partager le stock entre plusieurs téléphones."}</span>
      ${pending>0 && html`<span>${pending} modification${pending>1?"s":""} en attente d'envoi</span>`}</div></div>
    ${connected ? html`<div class="actions">
        <button type="button" class="btn del press" onClick=${()=>{logout(); buzz(10);}}>Se déconnecter</button>
        <button type="button" class="btn main press" onClick=${()=>{resync(); buzz(10);}}>Synchroniser</button></div>`
    : html`<form class="form" onSubmit=${submit}>
        <label class="field">Adresse du serveur<input id="pb-url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://stock.mondomaine.fr" required value=${url} onChange=${e=>setUrl(e.target.value)} /></label>
        <label class="field">E-mail<input id="pb-email" type="email" autocomplete="username" autocapitalize="off" required value=${email} onChange=${e=>setEmail(e.target.value)} /></label>
        <label class="field">Mot de passe<input id="pb-pw" type="password" autocomplete="current-password" required value=${pw} onChange=${e=>setPw(e.target.value)} /></label>
        ${err && html`<p class="form-err" role="alert">${err}</p>`}
        <div class="actions">
          ${pb && html`<button type="button" class="btn del press" onClick=${()=>logout()}>Oublier</button>`}
          <button class="btn main press" type="submit" disabled=${busy}>${busy?"Connexion…":"Se connecter"}</button></div>
        <p class="hint">Le stock déjà présent sur ce téléphone est envoyé sur le serveur à la connexion.</p>
      </form>`}
  `}<//>`;
}

/* ---------- Product database: Open Food Facts (+ Open Products / Beauty Facts) ---------- */
const OFF_FIELDS="code,product_name_fr,product_name,generic_name_fr,brands,quantity,image_front_small_url,image_small_url,nutriscore_grade,nova_group,ecoscore_grade,environmental_score_grade,categories_tags";
const OFF_HOSTS=[["world.openfoodfacts.org","OPEN FOOD FACTS"],["world.openproductsfacts.org","OPEN PRODUCTS FACTS"],["world.openbeautyfacts.org","OPEN BEAUTY FACTS"]];
const OFF_CACHE="gm-products";
const grade=(g)=> /^[a-e]$/.test(g||"") ? g : "";
// GTIN check digit (EAN-8, UPC-A, EAN-13, GTIN-14): rejects misreads before they reach the product database
const validGtin=(code)=>{ if(!/^(\d{8}|\d{12,14})$/.test(code)) return false;
  const d=code.split("").map(Number), chk=d.pop(); let sum=0;
  d.reverse().forEach((n,i)=>{ sum+=n*(i%2===0?3:1); }); return (10-sum%10)%10===chk; };
const guessPlace=(tags)=>{ const t=(tags||[]).join(" ");
  if(/frozen|surgel/.test(t)) return "Congélateur";
  if(/wines|beers|ciders|spirits|alcoholic-beverages/.test(t)) return "Cave";
  if(/dairies|dairy|yogurts|cheeses|fresh-|meats|charcuteries|hams|sausages|fishes|seafood|butters|creams|dairy-desserts|ready-meals|refrigerated|tofu|fresh-pasta|salads|smoked-salmon|eggs/.test(t)) return "Frigo";
  return "Placard"; };
async function fetchJSON(url,ms){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),ms);
  try{ const r=await fetch(url,{signal:ac.signal,headers:{Accept:"application/json"}}); return r.ok ? await r.json() : {status:0}; }
  finally{ clearTimeout(t); }
}
async function lookup(code){
  const cache=lsGet(OFF_CACHE,{}); if(cache[code]) return cache[code];
  const codes=[code]; if(code.length===12) codes.push("0"+code); if(code.length===13&&code[0]==="0") codes.push(code.slice(1));
  for(const [host,source] of OFF_HOSTS){
    for(const c of codes){
      let j; try{ j=await fetchJSON(`https://${host}/api/v2/product/${c}.json?fields=${OFF_FIELDS}`, host.includes("food")?8000:5000); }
      catch(e){ if(host.includes("food")) return {found:false,offline:true}; continue; }
      const p=j&&j.status===1&&j.product; if(!p) continue;
      const name=(p.product_name_fr||p.product_name||p.generic_name_fr||"").trim(), brand=(p.brands||"").split(",")[0].trim();
      if(!name&&!brand) continue;
      const out={found:true,source,name,brand,hint:p.quantity||"",image:p.image_front_small_url||p.image_small_url||"",
        nutri:grade(p.nutriscore_grade),eco:grade(p.environmental_score_grade||p.ecoscore_grade),nova:Number(p.nova_group)||0,location:guessPlace(p.categories_tags)};
      const keys=Object.keys(cache); if(keys.length>400) delete cache[keys[0]];
      cache[code]=out; lsSet(OFF_CACHE,cache); return out;
    }
  }
  return {found:false};
}
// What a scanned/typed text is: a product barcode, a JSON label, or free text
function classify(text){
  text=(text||"").trim();
  try{ const j=JSON.parse(text); if(j&&typeof j==="object") return {name:j.name||j.nom||"",brand:j.brand||j.marque||"",expiry:j.expiry||j.dlc||"",qty:j.qty||1,unit:j.unit||"pcs",location:j.location||j.lieu||"Placard",code:j.code||"",raw:text}; }catch(e){}
  const digits=text.replace(/\s/g,"");
  if(/^\d{8,14}$/.test(digits)) return {code:digits,raw:text};
  const url=text.match(/(?:^|\/)(?:01\/)?(\d{14})(?:\/|$)/);         // GS1 Digital Link QR codes
  if(url && validGtin(url[1])) return {code:url[1].replace(/^0+(?=\d{13}$)/,""),raw:text};
  return {name:text.slice(0,80),raw:text};
}

/* ---------- Barcode detection ----------
   1. native BarcodeDetector (Android Chrome), 2. ZXing-C++ in WebAssembly (iPhone & the rest),
   3. ZXing JS as last resort. */
const SCAN_FORMATS=["ean_13","ean_8","upc_a","upc_e","qr_code","code_128","data_matrix"];
let detectorP=null, zx=null;
function getDetector(){
  if(detectorP) return detectorP;
  detectorP=(async()=>{
    if("BarcodeDetector" in window){
      try{ const sup=await BarcodeDetector.getSupportedFormats(); const f=SCAN_FORMATS.filter(x=>sup.includes(x));
        if(f.includes("ean_13")) return new BarcodeDetector({formats:f}); }catch(e){}
    }
    try{
      const m=await import("https://fastly.jsdelivr.net/npm/barcode-detector@3.1.3/dist/es/ponyfill.min.js");
      const d=new m.BarcodeDetector({formats:SCAN_FORMATS});
      try{ const c=document.createElement("canvas"); c.width=c.height=16; await d.detect(c); }catch(e){} // loads the wasm now
      return d;
    }catch(e){ return null; }
  })();
  return detectorP;
}
function zxingDecode(canvas){
  if(!window.ZXing||!ZXing.HTMLCanvasElementLuminanceSource) return null;
  if(!zx){ const F=ZXing.BarcodeFormat, hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.QR_CODE,F.CODE_128,F.DATA_MATRIX]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true); zx=new ZXing.MultiFormatReader(); zx.setHints(hints); }
  try{ const r=zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas))));
    return {rawValue:r.getText(),format:String(ZXing.BarcodeFormat[r.getBarcodeFormat()]||"").toLowerCase()}; }
  catch(e){ return null; }
}
async function detectIn(canvas){
  const d=await getDetector();
  if(d){ try{ const r=await d.detect(canvas); if(r&&r.length) return r; }catch(e){} return []; }
  const z=zxingDecode(canvas); return z?[z]:[];
}
// A retail barcode must pass its check digit; anything else must be read twice in a row
const isRetail=(h)=>/^(ean_13|ean_8|upc_a)$/.test(h.format||"")||(!h.format&&/^\d{8,14}$/.test(h.rawValue||""));
async function decodeImageFile(file){
  let bmp;
  try{ bmp=await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ bmp=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=URL.createObjectURL(file); }); }
  const w=bmp.width,h=bmp.height;
  for(const max of [1600,1000,2400]){
    const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement("canvas");
    c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d",{willReadFrequently:true}).drawImage(bmp,0,0,c.width,c.height);
    const hits=(await detectIn(c)).filter(x=>x.rawValue&&(!isRetail(x)||validGtin(x.rawValue.trim())));
    if(hits.length) return hits[0].rawValue.trim();
  }
  throw new Error("notfound");
}
if("requestIdleCallback" in window) requestIdleCallback(()=>getDetector()); else setTimeout(getDetector,1500);

/* ---------- Bottom sheet with drag-to-dismiss ---------- */
function Sheet({label,children,onClose}){
  const ref=useRef(null), drag=useRef(null);
  const [closing,setClosing]=useState(false);
  const close=()=>{ setClosing(c=>{ if(!c) setTimeout(onClose,REDUCED?0:230); return true; }); };
  useEffect(()=>{ const k=e=>e.key==="Escape"&&close(); addEventListener("keydown",k); return()=>removeEventListener("keydown",k); },[]);
  const down=e=>{ drag.current={y:e.clientY,dy:0}; e.currentTarget.setPointerCapture(e.pointerId); ref.current.style.transition="none"; };
  const move=e=>{ if(!drag.current) return; const dy=Math.max(0,e.clientY-drag.current.y); drag.current.dy=dy; ref.current.style.transform=`translateY(${dy}px)`; };
  const up=()=>{ if(!drag.current) return; const dy=drag.current.dy; drag.current=null;
    ref.current.style.transition="transform .45s var(--spring)";
    if(dy>110){ close(); } else { ref.current.style.transform=""; } };
  return html`<div class=${"scrim"+(closing?" out":"")} onClick=${e=>e.target===e.currentTarget&&close()}>
    <div class=${"sheet"+(closing?" out":"")} ref=${ref} role="dialog" aria-modal="true" aria-label=${label}>
      <div class="grab" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}><span></span></div>
      ${children(close)}
    </div></div>`;
}

/* ---------- Receipt ---------- */
function Barcode({code}){
  const s=(code||"0000000000000").replace(/\D/g,"").padEnd(13,"7");
  let x=0; const bars=[];
  for(let i=0;i<s.length*2;i++){ const d=+s[i%s.length]; const w=1+((d+i)%3); if(i%2===0) bars.push(html`<rect key=${i} x=${x} y="0" width=${w} height="38" fill="currentColor"/>`); x+=w+1+(d%2); }
  return html`<svg viewBox=${`0 0 ${x} 38`} preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}
const NUTRI_C={a:"#038141",b:"#85bb2f",c:"#fecb02",d:"#ee8100",e:"#e63e11"};
function Score({label,g}){ return g ? html`<span class="score" style=${{"--sc":NUTRI_C[g]}}><small>${label}</small><b>${g.toUpperCase()}</b></span>` : null; }
function Ticket({p,count}){
  const now=new Date();
  return html`<div class="ticket" aria-label="Ticket de scan">
    <div class="t-head">GARDE-MANGER</div>
    <div class="r"><span>${now.toLocaleDateString("fr-FR")}</span><span>${now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span></div>
    <hr/>
    <div class="r"><span>SCAN N°</span><span>${String(count).padStart(4,"0")}</span></div>
    <div class="t-prod">
      <div class="t-big">${p.loading?html`<span class="blink">RECHERCHE DU PRODUIT…</span>`:(p.name||"Article non référencé")}</div>
      ${p.image && html`<img class="t-img" src=${p.image} alt="" referrerpolicy="no-referrer"/>`}
    </div>
    ${p.brand && html`<div class="r"><span>MARQUE</span><span>${p.brand.toUpperCase()}</span></div>`}
    ${p.hint && html`<div class="r"><span>FORMAT</span><span>${p.hint}</span></div>`}
    ${p.code && html`<div class="r"><span>EAN</span><span>${p.code}</span></div>`}
    ${(p.nutri||p.eco||p.nova>0) && html`<div class="t-scores"><${Score} label="NUTRI" g=${p.nutri}/>${p.nova>0 && html`<span class="score nova n${p.nova}"><small>NOVA</small><b>${p.nova}</b></span>`}<${Score} label="ÉCO" g=${p.eco}/></div>`}
    <div class="r"><span>SOURCE</span><span>${p.loading?"…":p.found?p.source:p.offline?"HORS LIGNE":p.code?"INCONNU · À COMPLÉTER":"QR CODE"}</span></div>
    <hr/>
    <${Barcode} code=${p.code||p.raw}/>
  </div>`;
}

/* ---------- Scanner ---------- */
function Scanner({onResult,onClose}){
  const video=useRef(null), stream=useRef(null), done=useRef(false), timer=useRef(0), last=useRef({v:"",n:0});
  const [mode,setMode]=useState("starting"); const [err,setErr]=useState(""); const [typed,setTyped]=useState("");
  const [closing,setClosing]=useState(false); const [torch,setTorch]=useState(null); const [slow,setSlow]=useState(false);
  const stop=()=>{ done.current=true; clearTimeout(timer.current); if(stream.current) stream.current.getTracks().forEach(t=>t.stop()); };
  const finish=(text)=>{ if(done.current) return; stop(); setMode("found"); scanBeep(); buzz(70); setTimeout(()=>onResult(text),REDUCED?0:450); };
  const close=()=>{ stop(); setClosing(true); setTimeout(onClose,REDUCED?0:200); };
  useEffect(()=>{
    let tick=0; const canvas=document.createElement("canvas"); const ctx=canvas.getContext("2d",{willReadFrequently:true});
    const t0=Date.now();
    const loop=async()=>{
      if(done.current) return;
      const v=video.current;
      if(v && v.readyState>=2 && v.videoWidth){
        const vw=v.videoWidth, vh=v.videoHeight, full=(tick++%3===2);
        const cw=full?vw:Math.round(vw*0.9), ch=full?vh:Math.round(vh*(vh>vw?0.42:0.62));
        const k=Math.min(1,1280/Math.max(cw,ch)); canvas.width=Math.round(cw*k); canvas.height=Math.round(ch*k);
        ctx.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,canvas.width,canvas.height);
        const hits=await detectIn(canvas);
        for(const h of hits){
          const val=(h.rawValue||"").trim(); if(!val) continue;
          if(isRetail(h)){ if(validGtin(val)) return finish(val); continue; }
          if(last.current.v===val){ if(++last.current.n>=2) return finish(val); } else last.current={v:val,n:1};
        }
        if(!slow && Date.now()-t0>7000) setSlow(true);
      }
      timer.current=setTimeout(loop,60);
    };
    (async()=>{
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("no cam");
        const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});
        if(done.current){ s.getTracks().forEach(t=>t.stop()); return; }
        stream.current=s; const track=s.getVideoTracks()[0];
        try{ const caps=track.getCapabilities?track.getCapabilities():{};
          if(caps.focusMode&&caps.focusMode.includes("continuous")) await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
          if(caps.torch) setTorch(false); }catch(e){}
        const v=video.current; v.srcObject=s; v.setAttribute("playsinline",""); v.muted=true; await v.play().catch(()=>{});
        setMode("live"); getDetector().then(()=>{ if(!done.current) loop(); });
      }catch(e){ if(!done.current) setMode("photo"); }
    })();
    return ()=>stop();
  },[]);
  const toggleTorch=async()=>{ const t=stream.current&&stream.current.getVideoTracks()[0]; if(!t) return;
    try{ await t.applyConstraints({advanced:[{torch:!torch}]}); setTorch(!torch); buzz(8); }catch(e){} };
  const onPhoto=async(e)=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return; setErr(""); setMode("reading");
    try{ finish(await decodeImageFile(f)); }
    catch(x){ setMode("photo"); buzz([30,60,30]); setErr("Pas de code lisible sur cette photo. Rapprochez-vous, tenez le code bien à plat et évitez les reflets."); } };
  const msg = {starting:"Ouverture de la caméra…", live: slow?"Reculez un peu pour que le code soit net, et évitez les reflets.":"Visez le code-barres, il est lu tout seul.", photo:"Prenez le code en photo : il est lu dès que la photo est prise.", reading:"Lecture du code…", found:"Bip ! Code lu."}[mode];
  const ghost = useMemo(()=>Array.from({length:28},(_,i)=>1+((i*7)%4)),[]);
  return html`<div class=${"scan "+mode+(closing?" out":"")} role="dialog" aria-modal="true" aria-label="Scanner">
    <div class="scan-top"><b>Scanner</b>
      <div class="scan-tools">
        ${torch!==null && html`<button class=${"scan-x press"+(torch?" on":"")} aria-label=${torch?"Éteindre la lampe":"Allumer la lampe"} aria-pressed=${torch} onClick=${toggleTorch}>${I.torch}</button>`}
        <button class="scan-x press" aria-label="Fermer le scanner" onClick=${close}>${I.close}</button>
      </div></div>
    <div class="stage">
      <video ref=${video} playsInline muted autoPlay hidden=${mode!=="live"&&mode!=="found"}></video>
      <div class="frame">
        ${mode!=="live"&&mode!=="found" && html`<div class="ghost-code">${ghost.map((w,i)=>html`<i key=${i} style=${{"--w":w}}></i>`)}</div>`}
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        <span class="laser"></span>
        ${mode==="found" && html`<span class="flash"></span>`}
      </div>
    </div>
    <p class=${"scan-msg"+(err?" err":"")} aria-live="polite">${err||msg}</p>
    <div class="scan-cta">
      ${(mode==="photo"||mode==="reading") && html`<label class="cam press">${I.camera} Photographier le code
        <input id="photo" type="file" accept="image/*" capture="environment" onChange=${onPhoto} onClick=${unlockAudio} /></label>`}
      <form class="typed" onSubmit=${e=>{e.preventDefault(); const v=typed.trim(); if(v) finish(v);}}>
        <input id="typed-code" inputmode="numeric" autocomplete="off" placeholder="Ou tapez les chiffres sous le code…" value=${typed} onChange=${e=>setTyped(e.target.value)} />
        <button class="press" type="submit">OK</button>
      </form>
    </div>
  </div>`;
}

/* ---------- Editor ---------- */
const FILLED=["name","brand","location","image","nutri","nova","eco"];
function Editor({initial,scanCount,onSave,onDelete,onClose}){
  const [f,setF]=useState({qty:1,unit:"pcs",location:"Frigo",expiry:"",name:"",brand:"",code:"",...initial});
  const touched=useRef(new Set());
  const set=(k)=>(e)=>{ touched.current.add(k); setF(v=>({...v,[k]:e.target.value})); };
  // the product lookup finishes after the sheet opened: fill what the person has not typed yet
  useEffect(()=>{ if(initial.loading) return;
    setF(v=>{ const n={...v}; FILLED.forEach(k=>{ if(!touched.current.has(k) && initial[k]!=null && initial[k]!=="") n[k]=initial[k]; }); return n; });
  },[initial.loading]);
  const isNew=!initial.id;
  const quick=[["+3 j",3],["+1 sem.",7],["+1 mois",30],["+6 mois",182]];
  return html`<${Sheet} label="Article" onClose=${onClose}>${(close)=>html`
    ${initial.scanned && html`<${Ticket} p=${initial} count=${scanCount}/>`}
    <h2>${isNew?(initial.scanned?"Ranger cet article":"Nouvel article"):"Modifier"}</h2>
    <form class="form" onSubmit=${e=>{e.preventDefault(); if(!f.name.trim()) return;
      const {found,hint,scanned,raw,loading,offline,source,...clean}=f;
      onSave({...clean,name:f.name.trim(),qty:Math.max(0,Number(f.qty)||0),id:f.id||uid(),addedAt:f.addedAt||Date.now()}); buzz(15); close();}}>
      <label class="field">Produit<input id="f-name" required value=${f.name} onChange=${set("name")} placeholder=${initial.loading?"Recherche en cours…":"Ex. Riz basmati"} autoComplete="off" /></label>
      <label class="field">Marque<input id="f-brand" value=${f.brand} onChange=${set("brand")} placeholder="Facultatif" autoComplete="off" /></label>
      <div class="field">Rangé où ?
        <div class="places" role="group" aria-label="Emplacement">
          ${PLACES.map(p=>html`<button type="button" key=${p.id} class="place press" style=${{"--c":p.c}} aria-pressed=${f.location===p.id}
            onClick=${()=>{ touched.current.add("location"); setF(v=>({...v,location:p.id})); }}><i></i>${p.id==="Congélateur"?"Congél.":p.id}</button>`)}
        </div></div>
      <div class="two">
        <label class="field">Quantité<input id="f-qty" type="number" min="0" step="any" inputmode="decimal" value=${f.qty} onChange=${set("qty")} /></label>
        <label class="field">Unité<select id="f-unit" value=${f.unit} onChange=${set("unit")}>${UNITS.map(u=>html`<option key=${u} value=${u}>${u}</option>`)}</select></label>
      </div>
      <label class="field">À consommer avant<input id="f-exp" type="date" value=${f.expiry} onChange=${set("expiry")} /></label>
      <div class="quick">${quick.map(([l,n])=>html`<button type="button" key=${l} class="press" onClick=${()=>setF(v=>({...v,expiry:iso(n)}))}>${l}</button>`)}
        ${f.expiry && html`<button type="button" class="press" onClick=${()=>setF(v=>({...v,expiry:""}))}>Sans date</button>`}</div>
      <div class="actions">
        ${!isNew && html`<button type="button" class="btn del press" onClick=${()=>{onDelete(f); close();}}>Supprimer</button>`}
        <button class="btn main press" type="submit">${isNew?"Ajouter au stock":"Enregistrer"}</button>
      </div>
    </form>`}<//>`;
}

/* ---------- Rows ---------- */
const Face=({it})=> it.image
  ? html`<b class="photo"><img src=${it.image} alt="" loading="lazy" referrerpolicy="no-referrer" onError=${e=>{ e.currentTarget.parentNode.classList.remove("photo"); e.currentTarget.replaceWith(document.createTextNode(initials(it.name))); }}/></b>`
  : html`<b>${initials(it.name)}</b>`;
function StockCard({it,i,onOpen,onStep}){
  const st=status(it), lab=expLabel(it);
  return html`<div class="card" style=${{"--i":Math.min(i,10),"--c":placeColor(it.location),"--rc":ringColor[st],viewTransitionName:"c-"+it.id}}>
    <div class="ring" style=${{"--p":ringPct(it)}} aria-hidden="true"><${Face} it=${it}/></div>
    <button class="info" onClick=${()=>onOpen(it)}>
      <div class="name">${it.name}</div>
      <div class="sub">${lab && html`<span class="exp">${lab}</span>`}${it.nutri && html`<span class="ns" style=${{"--sc":NUTRI_C[it.nutri]}}>${it.nutri.toUpperCase()}</span>`}${it.brand && html`<span>${it.brand}</span>`}</div>
    </button>
    <div class="step">
      <button class="press" aria-label=${"Retirer un "+it.name} onClick=${()=>onStep(it,-1)}>${I.minus}</button>
      <div class="num"><output key=${it.qty}>${it.qty}</output>${qtyText(it) && html`<small>${qtyText(it)}</small>`}</div>
      <button class="press" aria-label=${"Ajouter un "+it.name} onClick=${()=>onStep(it,1)}>${I.plus}</button>
    </div>
  </div>`;
}
function CourseCard({it,i,onBuy,onRemove,onOpen}){
  return html`<div class="card" style=${{"--i":Math.min(i,10),"--c":placeColor(it.location),"--rc":"var(--line)",viewTransitionName:"c-"+it.id}}>
    <div class="ring" style=${{"--p":0}} aria-hidden="true"><${Face} it=${it}/></div>
    <button class="info" onClick=${()=>onOpen(it)}>
      <div class="name">${it.name}</div>
      <div class="sub"><span>${it.location}</span>${it.brand && html`<span>${it.brand}</span>`}</div>
    </button>
    <div style=${{display:"flex",alignItems:"center",gap:"2px"}}>
      <button class="x-sm press" aria-label=${"Retirer "+it.name+" de la liste"} onClick=${()=>onRemove(it)}>${I.close}</button>
      <button class="buy press" onClick=${()=>onBuy(it)}>Acheté</button>
    </div>
  </div>`;
}

/* ---------- App ---------- */
function App(){
  const store=useStock(); const {items,put,del,bump,sync}=store; const [syncOpen,setSyncOpen]=useState(false);
  const [tab,setTab]=useState("stock");
  const [q,setQ]=useState(""); const [place,setPlace]=useState("Tout");
  const [scan,setScan]=useState(false); const [edit,setEdit]=useState(null);
  const [toast,setToast]=useState(null);
  const [scanCount,setScanCount]=useState(()=>{ try{ return +localStorage.getItem("gm-scans")||0; }catch(e){ return 0; } });

  const stock=items.filter(i=>(Number(i.qty)||0)>0);
  const courses=items.filter(i=>(Number(i.qty)||0)<=0);
  const c={ok:0,warn:0,bad:0,none:0}; stock.forEach(i=>c[status(i)]++);
  const watch=c.warn+c.bad;

  const match=(i)=>{ const s=q.trim().toLowerCase(); return (place==="Tout"||i.location===place)&&(!s||(i.name+" "+(i.brand||"")+" "+(i.code||"")).toLowerCase().includes(s)); };
  const sorter=(a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999")||a.name.localeCompare(b.name);
  const list = (tab==="soon" ? stock.filter(i=>["warn","bad"].includes(status(i))) : tab==="courses" ? courses : stock).filter(match).sort(sorter);
  const shelves = tab==="stock" ? PLACES.map(p=>[p,list.filter(i=>i.location===p.id)]).filter(s=>s[1].length) : [[null,list]];

  const flash=(msg,undo)=>{ setToast({msg,undo,k:Date.now()}); clearTimeout(window.__t); window.__t=setTimeout(()=>setToast(null),4200); };
  const step=(it,d)=>{ buzz(8);
    if((Number(it.qty)||0)+d<=0){ vt(()=>bump(it,d)); flash(`${it.name} → liste de courses`,()=>vt(()=>put(it))); }
    else bump(it,d); };
  const remove=(it)=>{ vt(()=>del(it.id)); flash(`${it.name} supprimé`,()=>vt(()=>put(it))); };
  const buy=(it)=>{ buzz(12); vt(()=>put({...it,qty:1,expiry:""})); flash(`${it.name} remis en stock`); };
  const go=(t)=>{ if(t!==tab){ buzz(6); vt(()=>{ setTab(t); }); window.scrollTo({top:0,behavior:REDUCED?"auto":"smooth"}); } };

  const openScan=()=>{ unlockAudio(); buzz(10); setScan(true); };
  const onScanned=(text)=>{
    setScan(false);
    const n=scanCount+1; setScanCount(n); try{ localStorage.setItem("gm-scans",n); }catch(e){}
    const p=classify(text);
    const existing=p.code&&items.find(i=>i.code===p.code);
    if(existing){ const nq=(Number(existing.qty)||0)+1; vt(()=>bump(existing,1)); flash(`+1 ${existing.name} · ${nq} ${qtyText(existing)||"en stock"}`); return; }
    if(!p.code){ setEdit({...p,scanned:true}); return; }
    setEdit({...p,scanned:true,loading:true,location:"Placard"});
    lookup(p.code).then(r=>setEdit(e=> e&&e.scanned&&e.code===p.code ? {...e,...r,loading:false} : e));
  };

  const wd=new Date().toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");
  const total=Math.max(1,stock.length);
  const titles={stock:"Garde-manger",soon:"À finir vite",courses:"Courses"};

  return html`<div class="app">
    <header class="top">
      <div><div class="date">${wd}</div><h1>${titles[tab]}</h1></div>
      <div class="top-act"><button class="round ghost press" aria-label=${"Synchronisation : "+SYNC_LABEL[sync]} onClick=${()=>setSyncOpen(true)}>${I.cloud}<span class="sdot" style=${{background:SYNC_COLOR[sync]}}></span></button>
      <button class="round press" aria-label="Ajouter un article à la main" onClick=${()=>setEdit({location:place!=="Tout"?place:"Frigo"})}>${I.plus}</button></div>
    </header>

    ${tab==="stock" && html`<section class="fresh" aria-label="Fraîcheur du stock">
      <div class="fresh-top">
        <div><span class="big">${stock.length}</span><span class="big-l">article${stock.length>1?"s":""} en stock</span></div>
        ${watch>0 && html`<button class="watch press" onClick=${()=>go("soon")}><span class="dot"></span>${watch} à surveiller</button>`}
      </div>
      <div class="seg" role="img" aria-label=${`${c.ok} frais, ${c.warn} à finir sous 3 jours, ${c.bad} périmés, ${c.none} sans date`}>
        ${[["ok","var(--ok)"],["warn","var(--warn)"],["bad","var(--bad)"],["none","var(--line)"]].map(([k,col])=>html`<i key=${k} style=${{flexGrow:c[k]/total,flexBasis:0,background:col,display:c[k]?"block":"none"}}></i>`)}
      </div>
      <div class="legend">
        <span><i style=${{background:"var(--ok)"}}></i><b>${c.ok}</b> frais</span>
        <span><i style=${{background:"var(--warn)"}}></i><b>${c.warn}</b> sous 3 j</span>
        <span><i style=${{background:"var(--bad)"}}></i><b>${c.bad}</b> périmé${c.bad>1?"s":""}</span>
        <span><i style=${{background:"var(--line)"}}></i><b>${c.none}</b> sans date</span>
      </div>
    </section>`}

    <div class="tools">
      <label class="search">${I.search}<input id="search" type="search" placeholder="Chercher un produit, une marque…" value=${q} onChange=${e=>setQ(e.target.value)} aria-label="Rechercher" /></label>
      <div class="chips" role="group" aria-label="Emplacement">
        ${[{id:"Tout",c:"var(--ink)"},...PLACES].map(p=>html`<button key=${p.id} class="chip press" style=${{"--c":p.c}} aria-pressed=${place===p.id} onClick=${()=>vt(()=>setPlace(p.id))}><i></i>${p.id}</button>`)}
      </div>
    </div>


    ${list.length===0 && html`<div class="empty">
      <div class="art">${tab==="courses"?I.cart:tab==="soon"?I.clock:I.scan}</div>
      <h3>${q||place!=="Tout"?"Rien ici":tab==="courses"?"Liste vide":tab==="soon"?"Tout est frais":"Stock vide"}</h3>
      <p>${q||place!=="Tout"?"Essayez une autre recherche ou un autre emplacement.":tab==="courses"?"Quand un produit tombe à zéro, il atterrit ici.":tab==="soon"?"Aucun produit ne périme dans les 3 prochains jours.":"Scannez un code-barres ou ajoutez un produit avec le bouton +."}</p>
    </div>`}

    ${shelves.map(([p,rows])=>html`<section class="shelf" key=${p?p.id:tab}>
      ${p && html`<h2 class="shelf-h" style=${{"--c":p.c}}><i></i>${p.id}<span>${rows.length} réf.</span></h2>`}
      <div class="cards">${rows.map((it,i)=> tab==="courses"
        ? html`<${CourseCard} key=${it.id} it=${it} i=${i} onBuy=${buy} onRemove=${remove} onOpen=${setEdit}/>`
        : html`<${StockCard} key=${it.id} it=${it} i=${i} onOpen=${setEdit} onStep=${step}/>`)}</div>
    </section>`)}

    <nav class="dock" aria-label="Navigation">
      <div class="tabbar">
        <button class="tab press" aria-current=${tab==="stock"?"page":undefined} onClick=${()=>go("stock")}>${I.shelf}Stock</button>
        <button class="tab press" aria-current=${tab==="soon"?"page":undefined} onClick=${()=>go("soon")}>${I.clock}Bientôt${watch>0 && html`<span class="badge" key=${"w"+watch}>${watch}</span>`}</button>
        <button class="fab press" aria-label="Scanner un code" onClick=${openScan}>${I.scan}</button>
        <button class="tab press" aria-current=${tab==="courses"?"page":undefined} onClick=${()=>go("courses")}>${I.cart}Courses${courses.length>0 && html`<span class="badge" key=${"c"+courses.length}>${courses.length}</span>`}</button>
        <button class="tab press" onClick=${()=>setEdit({location:place!=="Tout"?place:"Frigo"})}>${I.pen}Saisir</button>
      </div>
    </nav>

    ${syncOpen && html`<${SyncSheet} store=${store} onClose=${()=>setSyncOpen(false)} />`}
    ${scan && html`<${Scanner} onResult=${onScanned} onClose=${()=>setScan(false)} />`}
    ${edit && html`<${Editor} key=${edit.id||"new"+scanCount} initial=${edit} scanCount=${scanCount} onClose=${()=>setEdit(null)}
      onSave=${it=>{ vt(()=>put(it)); flash(`${it.name} rangé · ${it.location}`); }} onDelete=${it=>remove(it)} />`}
    ${toast && html`<div class="toast" role="status" key=${toast.k}><span>${toast.msg}</span>${toast.undo && html`<button onClick=${()=>{toast.undo();setToast(null);}}>Annuler</button>`}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
